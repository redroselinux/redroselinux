set default=0
set timeout=5

set gfxmode=1024x768,auto
terminal_output gfxterm

set menu_color_normal=white/black
set menu_color_highlight=white/light-red

menuentry "Install Redrose Linux" {
    linux /boot/linuxImage loglevel=1 nomodeset
    initrd /boot/initramfs.cpio.gz
}

menuentry "Important Information" {
    echo "Welcome to the Redrose Linux Installer!"
    echo ""
    echo "If you need more logs in the booting process, press 'e' while hovering it and remove loglevel=1."
    echo "By default, it uses nomodeset."
    echo "The installer boots pretty quickly, and is very simple with a TUI."
    echo "You are using an alpha version!"
    echo "Do not install it on your main machine. It is unstable"
    echo ""
    echo "Press any key to continue..."
    read
}

menuentry "Boot existing OS" {
    exit
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
